{% extends "filmes/base.html" %}
{% block content %}
<div class="card">
    <h1>{{ filme.titulo }}</h1>
    <p><strong>Diretor:</strong> {{ filme.diretor|default:"—" }}</p>
    <p><strong>Ano:</strong> {{ filme.ano|default:"—" }}</p>
    <p><strong>Gênero:</strong> {{ filme.genero|default:"—" }}</p>
    <p><strong>Nota:</strong> <span class="nota">{{ filme.nota }}/10</span></p>
    <p><small>Cadastrado em {{ filme.criado_em|date:"d/m/Y H:i" }}</small></p>
    <div style="margin-top:16px;">
        <a href="{% url 'editar' filme.pk %}"><button>Editar</button></a>
        <a href="{% url 'excluir' filme.pk %}"><button style="background:#cc0000;margin-left:8px;">Excluir</button></a>
    </div>
</div>
{% endblock %}
