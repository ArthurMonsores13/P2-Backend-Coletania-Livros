{% extends "filmes/base.html" %}
{% block content %}
<div class="card">
    <h1>Editar: {{ filme.titulo }}</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<span class="error">{{ field.errors|join:", " }}</span>{% endif %}
        {% endfor %}
        <button type="submit">Salvar</button>
        <a href="{% url 'detalhe' filme.pk %}" style="margin-left:12px;color:#666;">Cancelar</a>
    </form>
</div>
{% endblock %}
