<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Filmes</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
        h1 { color: #333; }
        nav a { margin-right: 16px; color: #0066cc; text-decoration: none; }
        nav a:hover { text-decoration: underline; }
        .card { background: white; border-radius: 8px; padding: 20px; margin: 16px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0052a3; }
        .nota { font-size: 2em; font-weight: bold; color: #f5a623; }
        .error { color: red; font-size: 0.85em; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'listar' %}">Todos os Filmes</a>
        <a href="{% url 'cadastrar' %}">Cadastrar</a>
        <a href="{% url 'buscar' %}">Buscar por Nome</a>
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
