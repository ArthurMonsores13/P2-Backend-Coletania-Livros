services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: p2_db
      POSTGRES_USER: p2_user
      POSTGRES_PASSWORD: docker123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2_user -d p2_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_NAME: p2_db
      DB_USER: p2_user
      DB_PASSWORD: docker123
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: